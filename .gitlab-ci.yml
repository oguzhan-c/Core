# GitLab CI/CD. Asıl iş build/ci.sh'ta; bu dosya yalnızca ortamı (SDK, servisler) hazırlar.
# GitLab bu dosyayı depo kökünde arar (Settings → CI/CD → CI/CD configuration file ile değiştirilebilir).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+/   # v1.2.0 etiketi: paketler yayınlanır

stages: [test]

dotnet:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  timeout: 40m
  # Servislere job'dan takma adlarıyla erişilir (localhost değil)
  services:
    - name: rabbitmq:4-management
      alias: rabbitmq
    - name: apache/kafka:4.3.0
      alias: kafka
      variables:
        # Takma adla erişildiği için Kafka kendini "kafka:9092" olarak duyurmalı (imajın varsayılanı localhost)
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    - name: redis:7-alpine
      alias: redis
    - name: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
      alias: elasticsearch
      variables:
        ES_SETTING_DISCOVERY_TYPE: single-node
        ES_SETTING_XPACK_SECURITY_ENABLED: "false"
        ES_JAVA_OPTS: -Xms512m -Xmx512m
  variables:
    CAN_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    CAN_KAFKA_BOOTSTRAP: kafka:9092
    CAN_REDIS_URL: redis:6379
    CAN_ELASTICSEARCH_URL: http://elasticsearch:9200
    # CAN_AZURE_SERVICEBUS_CONNECTION: Settings → CI/CD → Variables'ta (masked) tanımlanırsa Service Bus testleri çalışır
    # NUGET_API_KEY (masked, protected) ve isteğe bağlı NUGET_SOURCE: etiketli derlemede yayın için
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    key:
      files: [Directory.Packages.props]
    paths: [.nuget/packages]
  script:
    - ./build/ci.sh restore
    - ./build/ci.sh build
    - ./build/ci.sh test
    - ./build/ci.sh pack
    - ./build/ci.sh publish   # etiket yoksa atlanır
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/test-results, artifacts/packages]
    reports:
      junit: artifacts/test-results/**/*.xml

client:
  stage: test
  image: node:22
  timeout: 10m
  script:
    - ./build/ci.sh client
