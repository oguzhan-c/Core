# Entegrasyon testlerinin servisleri: Jenkins, AWS CodeBuild ve yerel çalıştırma (./build/ci.sh services).
# Portlar localhost'a açılır; GitHub, GitLab, Azure DevOps ve Bitbucket kendi servis tanımlarını kullanır.
name: canfx-ci

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672"]

  kafka:
    image: apache/kafka:4.3.0   # tek düğüm KRaft; varsayılan ayarı localhost:9092
    ports: ["9092:9092"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    ports: ["9200:9200"]
    environment:
      ES_SETTING_DISCOVERY_TYPE: single-node
      ES_SETTING_XPACK_SECURITY_ENABLED: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0   # Azure Blob emülatörü
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--disableProductStyleUrl"]
    ports: ["10000:10000"]
