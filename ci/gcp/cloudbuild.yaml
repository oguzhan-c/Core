# Google Cloud Build. Asıl iş build/ci.sh'ta; .NET adımı .NET 10 SDK imajında çalışır.
# Kurulum: Cloud Build → Triggers → Create trigger → depo bağla → Configuration: "Cloud Build configuration file"
#          → ci/gcp/cloudbuild.yaml
# Elle: gcloud builds submit --config ci/gcp/cloudbuild.yaml .
# Service Bus testleri için: Secret Manager'daki bağlantı dizesini availableSecrets ile CAN_AZURE_SERVICEBUS_CONNECTION
# olarak ver (aşağıdaki yorum).
steps:
  - id: services
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["./ci/gcp/start-services.sh"]

  - id: build-and-test
    name: mcr.microsoft.com/dotnet/sdk:10.0
    entrypoint: bash
    args: ["./build/ci.sh", "all"]
    waitFor: ["services"]
    env:
      - DOTNET_NOLOGO=true
      - DOTNET_CLI_TELEMETRY_OPTOUT=true
      - CAN_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - CAN_KAFKA_BOOTSTRAP=kafka:9092
      - CAN_REDIS_URL=redis:6379
      - CAN_ELASTICSEARCH_URL=http://elasticsearch:9200
    # secretEnv: ["CAN_AZURE_SERVICEBUS_CONNECTION"]

  - id: client
    name: node:22
    entrypoint: bash
    args: ["./build/ci.sh", "client"]
    waitFor: ["-"]   # .NET adımıyla paralel

# availableSecrets:
#   secretManager:
#     - versionName: projects/$PROJECT_ID/secrets/can-servicebus/versions/latest
#       env: CAN_AZURE_SERVICEBUS_CONNECTION

timeout: 2400s
options:
  machineType: E2_HIGHCPU_8   # 8 GB bellek: Kafka + Elasticsearch
  logging: CLOUD_LOGGING_ONLY
