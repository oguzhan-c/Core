# Geliştirme veritabanı (Homebrew ile Postgres kurulu değilse): docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: northwind-can-db
    environment:
      POSTGRES_DB: northwind_can
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
    ports:
      - "5432:5432"
    volumes:
      - northwind-can-data:/var/lib/postgresql/data

  # İsteğe bağlı dağıtık önbellek: appsettings'te Redis:ConnectionString = "localhost:6379"
  redis:
    image: redis:7-alpine
    container_name: northwind-can-redis
    ports:
      - "6379:6379"

  # İz/metrik görüntüleyici (OTLP alıcısı 4317, arayüz http://localhost:18888): appsettings'te OpenTelemetry:Enabled = true
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: northwind-can-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

  # İsteğe bağlı ürün araması: appsettings'te Search:Elasticsearch:Url = "http://localhost:9200" (yoksa bellek içi arama)
  # Yalnızca geliştirme: güvenlik kapalı, tek düğüm.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: northwind-can-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - northwind-can-search:/usr/share/elasticsearch/data

volumes:
  northwind-can-data:
  northwind-can-search:
